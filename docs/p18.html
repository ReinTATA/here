<h1>2026-11-12</h1>
<p>读了《惑溺》，八则，是这一门里最短的。</p>
<blockquote>王安丰妇，常卿安丰。安丰曰："妇人卿婿，于礼为不敬，后勿复尔。"妇曰："亲卿爱卿，是以卿卿；我不卿卿，谁当卿卿？"遂恒听之。</blockquote>
<p>王戎这几天在三章里都出现过。</p>
<p>《任诞》开头，七人集于竹林之下，他最小。</p>
<p>《伤逝》里，他死了儿子，山简劝他，他说："圣人忘情，最下不及情；情之所钟，正在我辈。"</p>
<p>《惑溺》里，妻子管他叫"卿"，他说于礼不敬，让她别叫了；她说"我不卿卿，谁当卿卿"。他就随她去了。</p>
