<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>bigfin</title>
<style>
  html, body { margin: 0; height: 100%; background: #03060b; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c = document.getElementById('c');
const x = c.getContext('2d');
let W, H;

function resize() { W = c.width = innerWidth; H = c.height = innerHeight; }
addEventListener('resize', resize);
resize();

let seed = 20261029;
function rnd() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }

const snow = [...Array(340)].map(() => ({
  x: rnd() * W, y: rnd() * H,
  r: rnd() * 1.5 + 0.2,
  v: rnd() * 0.20 + 0.03,
  a: rnd() * 0.28 + 0.03,
}));

// 两条丝状触手：先向外折，再垂下去。这就是大鳍鱿鱼像“踩高跷”的原因
const fil = [
  { dir: -1, spread: 0.62, len: 0.58, phase: 0.0, k: 0.55, off: -22 },
  { dir:  1, spread: 0.52, len: 0.64, phase: 2.1, k: 0.48, off: 22 },
];

let t = 0;

function arms(cx, cy) {
  for (let i = 0; i < 8; i++) {
    const a = (i / 7 - 0.5) * 2.1;
    const len = 62 + Math.sin(i * 1.7) * 12;
    x.beginPath();
    x.moveTo(cx + Math.sin(a) * 5, cy + 14);
    x.quadraticCurveTo(
      cx + Math.sin(a) * 26, cy + 14 + len * 0.55,
      cx + Math.sin(a) * 16 + Math.sin(t * 0.9 + i) * 6, cy + 14 + len
    );
    x.strokeStyle = 'rgba(206,124,116,0.40)';
    x.lineWidth = 1.3;
    x.stroke();
  }
}

function filament(cx, cy, f) {
  const steps = 150;
  const total = H * f.len;
  const seg = total / steps;
  const pts = [];
  let px = cx + f.off;
  let py = cy + 48;
  pts.push([px, py]);

  for (let i = 1; i <= steps; i++) {
    const u = i / steps;
    const spread = f.spread * Math.exp(-Math.max(0, u - 0.13) * 9.5);
    const wob = Math.sin(t * f.k + u * 6.5 + f.phase) * 0.07 * u;
    const ang = spread + wob;
    px += Math.sin(ang) * seg * f.dir;
    py += Math.cos(ang) * seg;
    const wander = Math.sin(u * 8.5 + f.phase * 2.3 + t * 0.25) * 16 * Math.pow(u, 1.3);
    pts.push([px + wander, py]);
  }

  for (let i = 1; i < pts.length; i++) {
    const u = i / pts.length;
    const a = 0.55 * (1 - u * 0.55);
    x.beginPath();
    x.moveTo(pts[i - 1][0], pts[i - 1][1]);
    x.lineTo(pts[i][0], pts[i][1]);
    x.strokeStyle = `rgba(196,104,98,${a})`;
    x.lineWidth = 1.35 * (1 - u * 0.45);
    x.stroke();
  }
}

function frame() {
  t += 0.016;

  const bg = x.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#08121b');
  bg.addColorStop(0.5, '#04080e');
  bg.addColorStop(1, '#010204');
  x.fillStyle = bg;
  x.fillRect(0, 0, W, H);

  for (const p of snow) {
    p.y += p.v;
    if (p.y > H) { p.y = -4; p.x = rnd() * W; }
    x.beginPath();
    x.arc(p.x, p.y, p.r, 0, 7);
    x.fillStyle = `rgba(185,210,232,${p.a})`;
    x.fill();
  }

  const cx = W * 0.5;
  const cy = H * 0.30 + Math.sin(t * 0.32) * 6;

  const g = x.createRadialGradient(cx, cy + 30, 0, cx, cy + 30, 260);
  g.addColorStop(0, 'rgba(120,42,42,0.16)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = g;
  x.beginPath();
  x.arc(cx, cy + 30, 260, 0, 7);
  x.fill();

  x.lineCap = 'round';
  x.shadowColor = 'rgba(255,86,74,0.5)';
  x.shadowBlur = 6;
  for (const f of fil) filament(cx, cy, f);
  x.shadowBlur = 0;

  // 身体
  x.save();
  x.translate(cx, cy);

  x.beginPath();
  x.ellipse(0, 0, 9, 19, 0, 0, 7);
  x.fillStyle = 'rgba(224,152,142,0.85)';
  x.fill();

  // 头顶的鳍
  x.beginPath();
  x.moveTo(-2, -17);
  x.quadraticCurveTo(-20, -26, -6, -8);
  x.closePath();
  x.fillStyle = 'rgba(226,164,154,0.55)';
  x.fill();
  x.beginPath();
  x.moveTo(2, -17);
  x.quadraticCurveTo(20, -26, 6, -8);
  x.closePath();
  x.fill();

  // 小小的眼睛
  x.beginPath();
  x.arc(-5, 6, 1.6, 0, 7);
  x.arc(5, 6, 1.6, 0, 7);
  x.fillStyle = 'rgba(20,10,12,0.9)';
  x.fill();

  arms(0, 0);

  x.restore();

  const v = x.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.22, W / 2, H / 2, Math.max(W, H) * 0.72);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(0,0,0,0.8)');
  x.fillStyle = v;
  x.fillRect(0, 0, W, H);

  requestAnimationFrame(frame);
}

frame();
</script>
</body>
</html>
